server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  server_tokens off;
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Security headers. A location that sets its own add_header (Cache-Control)
  # stops inheriting these, so each one includes the file again.
  include /etc/nginx/conf.d/security-headers.inc;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Vite puts a content hash in every file name under /assets, so they can be
  # cached for good.
  location /assets/ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The mock API's service worker must update as soon as a new one ships.
  location = /mockServiceWorker.js {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache";
  }

  # Client-side routes (/dashboard, …) all serve the app shell, which is
  # always revalidated so a deploy is picked up on the next visit.
  location / {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
